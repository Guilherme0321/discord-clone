services:
  - type: web
    name: discord-clone-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Defina manualmente no painel do Render após o primeiro deploy do
      # frontend: a URL pública dele (ex: https://discord-clone-frontend-xxxx.onrender.com)
      - key: CLIENT_URL
        sync: false

  - type: web
    name: discord-clone-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Defina manualmente no painel do Render após o primeiro deploy do
      # backend: a URL pública dele (ex: https://discord-clone-backend-xxxx.onrender.com)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
