name: Release desktop app (Windows)

# Builda o app Tauri (Windows) e publica os instaladores (.exe/.msi) num
# GitHub Release. Dispara ao empurrar uma tag "v*" (ex: v0.1.0), ou
# manualmente pela aba Actions quando não quiser criar uma tag ainda.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    # Sem isso, repos com o padrão "Read repository contents" no
    # GITHUB_TOKEN falham ao tentar criar o Release (permissão negada).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem isso, o build embutiria o fallback "http://localhost:4000" —
          # aponta explicitamente pro backend de produção no Render.
          VITE_API_URL: https://discord-clone-backend-35ub.onrender.com
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "Discordia ${{ github.ref_name }}"
          releaseBody: |
            Instalador para Windows gerado automaticamente pelo GitHub Actions.

            - `discordia_*_x64-setup.exe` — instalador NSIS (recomendado)
            - `discordia_*_x64_en-US.msi` — instalador MSI
          releaseDraft: true
          prerelease: false
