name: Deploy to Render

# Valida o build de backend e frontend antes de disparar o deploy no Render
# via Deploy Hook — só dispara se o build passar, e funciona mesmo que o
# auto-deploy nativo do Render (git-based) seja desligado no futuro.
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://discord-clone-backend-35ub.onrender.com

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      # A URL do Deploy Hook funciona como um bearer token (quem a tiver
      # consegue disparar deploy) — por isso vai em secrets, não em vars.
      - name: Trigger Render deploy (backend)
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

      - name: Trigger Render deploy (frontend)
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
